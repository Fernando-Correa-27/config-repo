server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bd_producto_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:}"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

mensaje:
  texto: Configuración obtenida desde Config Server para Producto Service
